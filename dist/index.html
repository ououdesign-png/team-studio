<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio · 视觉团队智能工作台</title><meta name="description" content="视觉团队的统一工作入口。选择场景、放入素材、预览并交付样机。"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="brand.css"></head>
<body>
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/><path d="m20 2 .6 1.4L22 4l-1.4.6L20 6l-.6-1.4L18 4l1.4-.6L20 2Z"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8l9-5Zm0 9v10M3 8l9 4 9-4M7.5 5.5l9 5"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4m0 3h.01"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="9" cy="18" r="2"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></symbol>
<symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></symbol>
<symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H5v20h14V7l-5-5Zm0 0v5h5M8 12h8m-8 4h8"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="i-collapse" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m6-11-3 3 3 3"/></symbol>
</defs></svg>
<div class="app" id="app">
<aside class="sidebar" id="sidebar">
<a class="brand" href="#home" aria-label="Studio 首页"><span class="brandmark"><i></i><i></i><i></i></span><span>Studio<span class="brand-dot">.</span></span></a>
<button class="new-task" id="newTask" aria-label="新建任务" data-tooltip="新建任务"><svg><use href="#i-plus"/></svg><span class="nav-label">新建任务</span><span class="shortcut">⌘ K</span></button>
<nav aria-label="平台导航">
<a href="#home" data-nav="home" aria-label="工作台" data-tooltip="工作台" class="active"><svg><use href="#i-grid"/></svg><span class="nav-label">工作台</span></a>
<a href="#tools" data-nav="tools" aria-label="工具中心" data-tooltip="工具中心"><svg><use href="#i-spark"/></svg><span class="nav-label">工具中心</span><span class="nav-count">1</span></a>
<a href="#tasks" data-nav="tasks" aria-label="我的任务" data-tooltip="我的任务"><svg><use href="#i-clock"/></svg><span class="nav-label">我的任务</span></a>
<a href="#templates" data-nav="templates" aria-label="样机模板" data-tooltip="样机模板"><svg><use href="#i-box"/></svg><span class="nav-label">样机模板</span></a>
</nav>
<div class="side-label">最近任务 <button class="icon-btn" id="refreshTasks" aria-label="刷新最近任务"><svg><use href="#i-clock"/></svg></button></div>
<div id="sideTasks" class="side-tasks"></div>
<div class="sidebar-bottom"><button class="sidebar-toggle" id="sidebarToggle" aria-controls="sidebar" aria-expanded="true" aria-label="收起导航" data-tooltip="收起导航"><svg><use href="#i-collapse"/></svg><span class="nav-label">收起导航</span></button></div>
</aside>
<div class="shell"><header class="topbar"><div class="crumb"><button class="icon-btn mobile-menu" id="menuBtn" aria-label="打开导航"><svg><use href="#i-collapse"/></svg></button><span>视觉设计部</span><span class="slash">/</span><strong id="crumbTitle">工作台</strong></div><div class="top-right"><button class="icon-btn" id="topHelp" aria-label="帮助"><svg><use href="#i-help"/></svg></button><span class="avatar small-avatar">设</span></div></header>
<main id="main"></main></div>
</div>
<dialog id="modal"><div class="modal-header"><h2 id="modalTitle"></h2><button class="icon-btn" id="closeModal" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div><div id="modalBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp" multiple hidden>
<script src="select-controls.js"></script><script src="app.js"></script></body></html>
